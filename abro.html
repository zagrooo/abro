<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>آبرو</title>
<style>
:root{
  --gold:#e9b96a; --gold2:#c08d3f; --gold3:#f5d9a2;
  --ink:#f4ecdd; --dim:#9aa6bd; --dim2:#65728c;
  --pan:#111726; --pan2:#182032; --pan3:#202b42;
  --line:#26324a; --line2:#33425f;
  --red:#e0604a; --green:#63c07a; --blue:#63a4e0;
  --fnt:'Vazirmatn','Vazir','IRANSansX','IRANSans','Segoe UI',Tahoma,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:#05070c;color:var(--ink);font-family:var(--fnt);
  display:grid;place-items:center;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}

/* ─── قاب دستگاه ─── */
#device{
  position:relative;width:100%;height:100dvh;max-width:none;overflow:hidden;background:#05070c;
}
@media (min-width:760px){
  body::before{
    content:'';position:fixed;inset:0;
    background:radial-gradient(ellipse 60% 50% at 50% 40%,#141c2c,#05070c 70%);
  }
  #device{
    width:min(430px,42vw);height:min(920px,94dvh);
    border-radius:32px;box-shadow:0 40px 100px rgba(0,0,0,.75),0 0 0 1px #232e44,0 0 0 9px #0b0f18;
  }
}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ─── لایه‌ی رابط ─── */
.ui{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none;
  padding:calc(10px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom))}
.ui>*{pointer-events:auto}

/* نوار بالا */
.topbar{display:flex;gap:7px;align-items:center}
.pill{
  display:flex;align-items:center;gap:7px;height:38px;padding:0 13px 0 9px;border-radius:19px;
  background:linear-gradient(180deg,rgba(28,37,56,.94),rgba(14,19,30,.94));
  border:1px solid var(--line2);backdrop-filter:blur(12px);
  box-shadow:0 4px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.07);
}
.pill .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none}
.pill.money .ic{background:linear-gradient(145deg,#f7d489,#c8933c);box-shadow:0 0 9px rgba(233,185,106,.45)}
.pill.abroo .ic{background:linear-gradient(145deg,#8fc3f0,#3d6f9e);box-shadow:0 0 9px rgba(99,164,224,.4)}
.pill .ic svg{width:13px;height:13px;fill:#241704;opacity:.75}
.pill.abroo .ic svg{fill:#08131f}
.pill b{font-size:14px;font-weight:700;letter-spacing:.2px;font-variant-numeric:tabular-nums}
.pill.money{flex:1;min-width:0}
.pill.money b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.bump{animation:bump .32s cubic-bezier(.3,1.4,.5,1)}
@keyframes bump{50%{transform:scale(1.07)}}
.iconbtn{
  width:38px;height:38px;flex:none;border-radius:13px;display:grid;place-items:center;
  background:rgba(16,22,34,.9);border:1px solid var(--line);backdrop-filter:blur(12px)
}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:var(--dim);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.on svg{stroke:var(--gold)}
.iconbtn:active{transform:scale(.9)}

/* نوار پرده */
.ribbon{margin-top:8px;display:flex;gap:7px;align-items:stretch}
.actbox{
  flex:1;min-width:0;padding:7px 11px 8px;border-radius:14px;
  background:linear-gradient(180deg,rgba(24,32,50,.9),rgba(12,17,27,.9));
  border:1px solid var(--line);backdrop-filter:blur(12px)
}
.actbox .r1{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;color:var(--dim2)}
.actbox .r1 b{font-size:12.5px;color:var(--ink);font-weight:600}
.track{height:5px;margin-top:6px;border-radius:99px;background:#080c14;overflow:hidden;border:1px solid #1c2536}
.track i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.track.act i{background:linear-gradient(90deg,#8a5a3a,var(--gold),var(--gold3))}
.track.int i{background:linear-gradient(90deg,#7a4636,#d99a52,#f0cf94)}
.closebtn{
  width:52px;flex:none;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:linear-gradient(180deg,rgba(38,48,72,.92),rgba(18,24,38,.92));
  border:1px solid var(--line2);backdrop-filter:blur(12px);font-size:9px;color:var(--dim)
}
.closebtn svg{width:17px;height:17px;fill:none;stroke:var(--gold);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.closebtn:active{transform:scale(.94)}

/* هدف */
.goal{
  margin-top:8px;display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:14px;
  background:linear-gradient(180deg,rgba(40,34,20,.92),rgba(20,17,11,.92));
  border:1px solid #4c3d22;backdrop-filter:blur(12px);
  animation:slidein .35s cubic-bezier(.2,.9,.25,1)
}
.goal[hidden]{display:none}
@keyframes slidein{from{opacity:0;transform:translateY(-10px)}}
.goal .gi{width:26px;height:26px;flex:none;border-radius:9px;background:rgba(233,185,106,.14);display:grid;place-items:center}
.goal .gi svg{width:15px;height:15px;fill:none;stroke:var(--gold);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.goal .gt{flex:1;min-width:0}
.goal .gt b{display:block;font-size:11.5px;font-weight:600}
.goal .gt .track{margin-top:5px}
.goal .track i{background:linear-gradient(90deg,var(--gold2),var(--gold3))}
.goal .claim{
  padding:7px 13px;border-radius:10px;font-size:11.5px;font-weight:700;flex:none;
  background:linear-gradient(180deg,#f0c87e,#c08d3f);color:#221503;box-shadow:0 3px 10px rgba(233,185,106,.3)
}
.goal .claim:disabled{background:#232c40;color:var(--dim2);box-shadow:none}
.goal .claim.ready{animation:pump .9s infinite}
@keyframes pump{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

.grow{flex:1}

/* نرخ */
.ratebadge{
  align-self:center;margin-bottom:9px;padding:6px 14px;border-radius:99px;font-size:11.5px;color:var(--gold3);
  background:rgba(10,14,22,.66);border:1px solid rgba(233,185,106,.2);backdrop-filter:blur(10px)
}

/* دکمه‌ی سرو */
.fabrow{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px}
.fab{
  position:relative;width:112px;height:112px;border-radius:50%;
  background:conic-gradient(var(--gold3) var(--heat,0deg),rgba(255,255,255,.07) 0);
  padding:5px;flex:none;
}
.fab .in{
  width:100%;height:100%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:radial-gradient(circle at 38% 30%,#f8dfa8,#c6913f 72%,#a2712c);
  box-shadow:0 8px 24px rgba(233,185,106,.32),inset 0 -4px 10px rgba(120,78,20,.5),inset 0 3px 8px rgba(255,255,255,.5);
  color:#2a1a05;
}
.fab .in b{font-size:16px;font-weight:800}
.fab .in span{font-size:10px;opacity:.72;font-weight:600}
.fab:active .in{transform:scale(.94)}
.fab .ring{position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(233,185,106,.5);opacity:0}
.fab.hit .ring{animation:ring .5s ease-out}
@keyframes ring{from{opacity:.85;transform:scale(.9)}to{opacity:0;transform:scale(1.32)}}

/* تب‌ها */
.tabs{
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:7px;border-radius:20px;
  background:linear-gradient(180deg,rgba(20,27,42,.94),rgba(10,14,23,.96));
  border:1px solid var(--line);backdrop-filter:blur(16px);box-shadow:0 -6px 24px rgba(0,0,0,.45)
}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;border-radius:14px;transition:.16s}
.tab svg{width:21px;height:21px;fill:none;stroke:var(--dim2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:9.5px;color:var(--dim2)}
.tab.sel{background:linear-gradient(180deg,#2a3550,#1a2233)}
.tab.sel svg{stroke:var(--gold)} .tab.sel span{color:var(--gold)}
.tab:active{transform:scale(.94)}
.tab .badge{position:absolute;top:5px;inset-inline-end:calc(50% - 19px);width:9px;height:9px;border-radius:50%;
  background:var(--red);border:1.5px solid #101725;box-shadow:0 0 8px rgba(224,96,74,.7)}
.tab .badge[hidden]{display:none}

/* شیت */
.scrim{position:absolute;inset:0;background:rgba(4,6,11,.5);backdrop-filter:blur(2px);opacity:0;transition:.25s;pointer-events:none;z-index:8}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:9;max-height:74%;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#1a2234,#0d121d);
  border-top:1px solid var(--line2);border-radius:24px 24px 0 0;
  box-shadow:0 -14px 44px rgba(0,0,0,.6);
  transform:translateY(102%);transition:transform .34s cubic-bezier(.25,.9,.25,1);
  padding-bottom:calc(8px + env(safe-area-inset-bottom))
}
.sheet.on{transform:translateY(0)}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line2);margin:9px auto 4px;flex:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 10px;flex:none}
.sh-head h3{margin:0;font-size:15px}
.seg{display:flex;gap:3px;padding:3px;border-radius:11px;background:#0c111b;border:1px solid var(--line)}
.seg button{padding:5px 10px;border-radius:8px;font-size:11px;color:var(--dim)}
.seg button.on{background:linear-gradient(180deg,#e9b96a,#c08d3f);color:#241604;font-weight:700}
.sh-body{overflow-y:auto;padding:0 12px 12px;-webkit-overflow-scrolling:touch}

/* کارت */
.card{
  display:flex;align-items:center;gap:10px;padding:10px;margin-bottom:8px;border-radius:16px;
  background:linear-gradient(180deg,var(--pan3),var(--pan2));border:1px solid var(--line);transition:.2s
}
.card.locked{opacity:.4;filter:saturate(.25)}
.card.ready{border-color:rgba(233,185,106,.4);box-shadow:0 0 16px rgba(233,185,106,.09)}
.c-ico{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 34% 24%,#2c3b57,#131b2a);border:1px solid var(--line2)}
.c-ico svg{width:22px;height:22px;fill:none;stroke:var(--gold);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card.locked .c-ico svg{stroke:var(--dim2)}
.c-ico .lv{position:absolute;bottom:-5px;inset-inline-start:-5px;min-width:19px;height:19px;padding:0 4px;
  border-radius:7px;background:linear-gradient(180deg,#e9b96a,#b8862f);color:#241604;
  font-size:10px;font-weight:800;display:grid;place-items:center;border:1.5px solid #131b2a}
.c-mid{flex:1;min-width:0}
.c-name{font-size:13.5px;font-weight:700}
.c-meta{font-size:10.5px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crewrow{display:flex;align-items:center;gap:6px;margin-top:7px}
.cbtn{width:24px;height:24px;border-radius:8px;background:#0d131f;border:1px solid var(--line2);
  font-size:15px;line-height:1;display:grid;place-items:center;color:var(--dim)}
.cbtn:active{transform:scale(.88)}
.cbtn:disabled{opacity:.25}
.dots{display:flex;gap:3.5px}
.dot{width:8px;height:8px;border-radius:50%;background:#19212f;border:1px solid var(--line2)}
.dot.f{background:var(--gold);border-color:var(--gold3);box-shadow:0 0 8px rgba(233,185,106,.65)}
.buy{
  flex:none;min-width:92px;padding:9px 10px;border-radius:13px;font-size:12px;font-weight:700;
  background:linear-gradient(180deg,#26324c,#151c2b);border:1px solid var(--line2);
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:.16s
}
.buy .c{font-size:10.5px;color:var(--dim);font-weight:500}
.buy.can{background:linear-gradient(180deg,#f0c87e,#c08d3f);color:#241604;border-color:#f5dbaa;
  box-shadow:0 4px 14px rgba(233,185,106,.26)}
.buy.can .c{color:#4a3208}
.buy:active{transform:scale(.95)}
.buy:disabled{opacity:.38}
.note{font-size:11.5px;color:var(--dim);line-height:1.9;padding:12px;border-radius:14px;
  background:#0d1220;border:1px dashed var(--line2);margin-bottom:8px}
.note b{color:var(--gold)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.kv div{padding:10px 12px;border-radius:14px;background:var(--pan2);border:1px solid var(--line)}
.kv span{display:block;font-size:10px;color:var(--dim2)}
.kv b{display:block;font-size:14px;margin-top:3px}
.dangerbtn{width:100%;padding:12px;border-radius:14px;background:#2a1a1a;border:1px solid #4d2a24;color:#e8a091;font-size:12.5px}

/* پرده‌ها */
.veil{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;
  background:rgba(4,6,11,.82);backdrop-filter:blur(9px);animation:fade .25s}
.veil[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.modal{width:min(400px,100%);max-height:86dvh;overflow-y:auto;border-radius:24px;padding:20px;
  background:linear-gradient(180deg,#1a2234,#0d121d);border:1px solid var(--line2);
  box-shadow:0 24px 70px rgba(0,0,0,.7);animation:rise .34s cubic-bezier(.2,.9,.25,1)}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.96)}}
.modal h3{margin:0 0 4px;font-size:17px}
.modal .sub{font-size:11.5px;color:var(--dim);margin:0 0 15px;line-height:1.8}
.lbl{font-size:10.5px;color:var(--dim2);margin:0 0 7px}
.opts{display:grid;gap:8px;margin-bottom:15px}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 13px;border-radius:14px;
  background:var(--pan3);border:1px solid var(--line);font-size:12.5px;cursor:pointer;transition:.16s}
.opt span i{font-style:normal;font-size:10.5px;color:var(--dim);text-align:end}
.opt input:checked+span{border-color:var(--gold);background:linear-gradient(180deg,#302614,#1d1a12)}
.row2{display:flex;gap:9px}
.ghost{flex:1;padding:13px;border-radius:14px;background:var(--pan3);border:1px solid var(--line2);font-size:13px}
.solid{flex:1;padding:13px;border-radius:14px;background:linear-gradient(180deg,#f0c87e,#c08d3f);color:#241604;font-size:13px;font-weight:800}

.evcard{width:min(400px,100%);border-radius:24px;overflow:hidden;border:1px solid var(--line2);
  background:linear-gradient(180deg,#1b2536,#0c111b);box-shadow:0 24px 70px rgba(0,0,0,.7);
  animation:rise .36s cubic-bezier(.2,.9,.25,1)}
.ev-top{padding:11px 16px;display:flex;justify-content:space-between;font-size:11px;color:var(--gold);
  background:linear-gradient(90deg,rgba(233,185,106,.15),transparent);border-bottom:1px solid var(--line)}
.ev-top span:last-child{color:var(--dim2)}
.ev-body{padding:17px}
.ev-body h3{margin:0 0 8px;font-size:19px}
.ev-body p{margin:0 0 15px;font-size:13px;line-height:2;color:#ccd6e6}
.ev-pick{display:grid;gap:9px}
.ev-pick button{text-align:start;padding:13px 14px;border-radius:15px;background:var(--pan3);border:1px solid var(--line2);transition:.16s}
.ev-pick button:active{transform:scale(.98)}
.ev-pick b{display:block;font-size:13.5px;margin-bottom:3px}
.ev-pick span{display:block;font-size:11px;color:var(--dim);line-height:1.7}

.receipt{width:min(340px,100%);max-height:86dvh;overflow-y:auto;background:#f3ede0;color:#241d12;
  border-radius:6px;padding:19px 17px;box-shadow:0 22px 60px rgba(0,0,0,.65);font-size:13px;
  animation:print .75s cubic-bezier(.2,.85,.25,1)}
@keyframes print{from{clip-path:inset(0 0 100% 0);transform:translateY(-26px)}to{clip-path:inset(0 0 0 0);transform:none}}
.r-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:9px;border-bottom:2px dashed #b9ad95;margin-bottom:10px}
.r-head b{font-size:16px} .r-head span{font-size:10.5px;color:#6f6350}
.r-row{display:flex;justify-content:space-between;padding:6px 0;font-size:12.5px;opacity:0;animation:rin .3s forwards}
@keyframes rin{to{opacity:1}}
.r-row.neg .num{color:#a13a22} .r-row.pos .num{color:#2f6d3b}
.num{font-variant-numeric:tabular-nums}
.r-note{margin:10px 0;padding:9px 11px;background:#e7ddc9;border-radius:5px;font-size:11.5px;line-height:1.9;color:#4c4231}
.r-total{display:flex;justify-content:space-between;padding-top:10px;border-top:2px dashed #b9ad95;font-weight:800;font-size:16px}
.r-btns{display:grid;gap:7px;margin-top:15px}
.r-btns button{padding:12px;border-radius:11px;font-size:12.5px;background:#241d12;color:#f3ede0;font-weight:700}
.r-btns .ad{background:linear-gradient(180deg,#409150,#2c6a38)}
.r-btns .ad:disabled{opacity:.5}
.r-btns .gh{background:transparent;color:#241d12;border:1px solid #b9ad95}

.act{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:#05070c;animation:fade .3s}
.act[hidden]{display:none}
.act-in{text-align:center;padding:20px}
.act-in em{display:block;font-style:normal;font-size:12px;color:var(--gold);letter-spacing:3px;opacity:0;animation:ai .6s .1s forwards}
.act-in b{display:block;font-size:clamp(30px,9vw,46px);margin:10px 0;opacity:0;animation:ai .7s .3s forwards}
.act-in i{display:block;font-style:normal;font-size:13px;color:var(--dim);opacity:0;animation:ai .7s .6s forwards;line-height:1.9}
.act-line{height:1px;width:0;margin:20px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:aw 1.1s .5s forwards}
@keyframes ai{to{opacity:1}}
@keyframes aw{to{width:200px}}

#boot{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#05070c;transition:opacity .7s,visibility .7s}
#boot.gone{opacity:0;visibility:hidden}
#boot b{display:block;font-size:44px;color:var(--gold);text-align:center;letter-spacing:5px}
#boot span{display:block;font-size:12px;color:var(--dim2);text-align:center;margin-top:10px}
#boot .ln{height:1px;width:0;margin:24px auto 0;background:linear-gradient(90deg,transparent,var(--gold2),transparent);animation:aw 1.3s .2s forwards}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));z-index:80;
  transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.32s cubic-bezier(.2,.9,.25,1);
  background:rgba(16,22,34,.96);border:1px solid var(--line2);border-radius:14px;padding:11px 16px;
  font-size:12.5px;max-width:min(340px,88vw);text-align:center;backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.on{transform:translate(-50%,0);opacity:1}
.flycoin{position:fixed;z-index:90;width:18px;height:18px;border-radius:50%;pointer-events:none;
  background:linear-gradient(145deg,#f7d489,#c8933c);box-shadow:0 0 10px rgba(233,185,106,.6)}
</style>
</head>
<body>

<div id="boot"><div><b>آبرو</b><span>یک دفترچه، یک چرخ، و یک خیابان</span><div class="ln"></div></div></div>

<div id="device">
  <canvas id="stage"></canvas>

  <div class="ui">
    <div class="topbar">
      <div class="pill money" id="moneyPill">
        <span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg></span>
        <b id="money">۰</b>
      </div>
      <div class="pill abroo" id="abrooPill">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.4l6-.8z"/></svg></span>
        <b id="abroo">۰</b>
      </div>

    const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);

    g.gain.setValueAtTime(.0001,t);

    g.gain.exponentialRampToValueAtTime(.0001,t+dur);

}

function buyPlan(s){

  const n=Math.min(+mult,space);

  for(const k of ['money','total','abroo','integ','tier','day','hired','runs','served']){
    const v=Number(raw[k]); if(isFinite(v)) base[k]=v;
  }
  base.tier=clamp(Math.floor(base.tier),0,TIERS.length-1);
  base.integ=clamp(base.integ,0,100);
  base.hired=Math.max(0,Math.floor(base.hired));
  for(const id of IDS){
    const l=Number(raw.lvl&&raw.lvl[id]), c=Number(raw.crew&&raw.crew[id]);
    base.lvl[id]=isFinite(l)?Math.max(0,Math.floor(l)):0;
    base.crew[id]=isFinite(c)?Math.max(0,Math.floor(c)):0;
  }
  for(const id of IDS){
    const l=base.lvl[id], cap=l?1+Math.floor((l-1)/7):0;
    base.crew[id]=Math.min(base.crew[id],cap);
  }
  let over=IDS.reduce((a,i)=>a+base.crew[i],0)-base.hired;
  for(const id of IDS){ while(over>0&&base.crew[id]>0){base.crew[id]--;over--;} }
  if(ING[raw.ing]) base.ing=raw.ing;
  if(RISK[raw.risk]) base.risk=raw.risk;
  if(typeof raw.lastNote==='string') base.lastNote=raw.lastNote;
  base.ts=Number(raw.ts)||Date.now();
  return base;
}

function rr(g,x,y,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);

let goal=null, goalT=35;
function newGoal(){
  const g=GOALS[Math.random()*GOALS.length|0];
  const n=Math.round(rnd(g.n[0],g.n[1]));
  const r=Math.max(rate(),200);
  const need=g.type==='earn'?Math.round(r*n):n;
  goal={type:g.type,need,have:0,left:g.t,txt:g.txt(n,need),done:false,
        reward:Math.max(8e3,g.type==='earn'?need*1.1:r*38)};
}
function goalTick(dt){
  if(!goal){
    goalT-=dt;
    if(goalT<=0&&spaceUsed()>0){ newGoal(); goalT=0; }
    return;
  }
  if(goal.done) return;
  goal.left-=dt;
  if(goal.have>=goal.need){ goal.done=true; SFX.win(); buzz([12,40,12]); }
  else if(goal.left<=0){ goal=null; goalT=rnd(50,80); }
}
function goalProgress(kind,amount){
  if(!goal||goal.done) return;
  if(goal.type===kind) goal.have+=amount;
}
function syncGoal(){
  const box=$('goalBox');
  if(!goal){ box.hidden=true; return; }

function flyCoin(fromEl){
  if(RM||!fromEl) return;
  const a=fromEl.getBoundingClientRect(), b=$('moneyPill').getBoundingClientRect();
  for(let i=0;i<5;i++){
    const s=document.createElement('div'); s.className='flycoin';
    s.style.left=(a.left+a.width/2-9+rnd(-14,14))+'px';
    s.style.top=(a.top+a.height/2-9+rnd(-10,10))+'px';
    document.body.appendChild(s);
    const dx=b.left+b.width/2-(a.left+a.width/2), dy=b.top+b.height/2-(a.top+a.height/2);
    const an=s.animate([
      {transform:'translate(0,0) scale(1)',opacity:1},
      {transform:'translate('+(dx*.4+rnd(-30,30))+'px,'+(dy*.4)+'px) scale(1.15)',offset:.5},
      {transform:'translate('+dx+'px,'+dy+'px) scale(.35)',opacity:.25}
    ],{duration:520+i*60,easing:'cubic-bezier(.4,0,.25,1)'});
    an.onfinish=()=>s.remove();
  }
  const p=$('moneyPill');
  setTimeout(()=>{p.classList.remove('bump');void p.offsetWidth;p.classList.add('bump');},520);
}

function wireSheet(){
  const body=$('shBody');
  body.onclick=e=>{
    const up=e.target.closest('[data-up]');
    if(up){ doUpgrade(up.dataset.up,up); return; }
    const cw=e.target.closest('[data-crew]');
    if(cw){
      const id=cw.dataset.id, d=+cw.dataset.crew;
      if(!IDS.includes(id)) return;
      if(d>0&&(crewFree()<=0||S.crew[id]>=need(id))){SFX.no();return;}
      if(d<0&&S.crew[id]<=0) return;
      S.crew[id]+=d; SFX.tap(0); buzz(6); syncSheet(); syncUI(); save();
      return;
    }
    if(e.target.closest('#hireBtn')){ doHire(e.target.closest('#hireBtn')); return; }
    if(e.target.closest('#tierBtn')){ doTier(); return; }
    if(e.target.closest('#prestigeBtn')){ doPrestige(); return; }
    if(e.target.closest('#resetBtn')){ doReset(); return; }
  };
}
function doUpgrade(id,btn){
  const s=STATIONS.find(x=>x.id===id);
  if(!s||S.tier<s.tier){SFX.no();return;}
  const p=buyPlan(s);
  if(p.full){SFX.no();toast('جا نداری. باید بزرگ‌تر شوی.');return;}
  if(S.money<p.c||p.n<=0){SFX.no();return;}
  const first=!S.lvl[s.id];
  S.money-=p.c; disp=S.money; S.lvl[s.id]+=p.n;
  SFX.buy(); buzz(10); flyCoin(btn);
  if(first) toast(s.name+' راه افتاد.');
  syncSheet(); syncUI(); save();
}
function doHire(btn){
  const c=hireCost();
  if(S.money<c){SFX.no();return;}
  S.money-=c; disp=S.money; S.hired++;
  crewLook.push(randPerson());
  SFX.buy(); buzz(10); flyCoin(btn);
  toast('یک نفر اضافه شد. بگذارش روی یک ایستگاه.');
  syncSheet(); syncUI(); save();
}
function doTier(){
  const t=tier();
  if(!t.next||S.money<t.cost){SFX.no();return;}
  S.money-=t.cost; disp=S.money; S.tier++;
  steam.length=0; coins.length=0; frameFor(S.tier);
  closeSheet(); actCard(); syncUI(); save();
}
function doPrestige(){
  const g=abrooGain();

    armed=setTimeout(()=>{armed=null;syncSheet();},4000);

    toast('همه‌چیز صفر می‌شود. '+fa(g)+' آبرو با تو می‌آید. دوباره بزن.');

  }
  clearTimeout(armed); armed=null;
  const keep=S.abroo+g, runs=S.runs+1;

      const base=Math.max(rate()*900,30e3), dm=Math.round(base*o.m), before=S.integ;
      S.money=Math.max(0,S.money+dm);

function runShift(hours,manual){
  hours=clamp(Number(hours)||0,0,12);
  if(hours<=0||!spaceUsed()) return;
  const ing=ING[S.ing], rk=RISK[S.risk];
  const luck=manual?(rk.lo+Math.random()*(rk.hi-rk.lo)):1;
  const eff=manual?.62:.5;
  const gross=rate()*3600*hours*eff*ing.out*luck;
  const ingCost=gross*ing.cost;
  const wages=S.hired*wage()*(hours/8);
  const note=NIGHT[Math.floor(Math.random()*NIGHT.length)];
  const net=Math.max(0,gross-ingCost-wages);
  S.day++; S.money+=net; S.total+=net;
  S.integ=clamp(S.integ+(manual?ing.integ:ing.integ*.4),0,100);
  S.lastNote=note;
  showReceipt({manual,gross,ingCost,wages,net,luck,note});
  syncUI(); save();
}
function showReceipt(d){
  $('rcTitle').textContent=d.manual?'گزارش شیفت':'گزارش غیبت';
  $('rcSub').textContent='شب '+fa(S.day)+' — '+tier().name;
  const rows=[['فروش ناخالص',d.gross,'pos'],
    ['مواد اولیه ('+ING[S.ing].label+')',-d.ingCost,'neg'],
    ['دستمزد '+fa(S.hired)+' نفر',-d.wages,'neg']];
  if(d.manual&&Math.abs(d.luck-1)>.12) rows.push([d.luck>1?'شب بهتر از انتظار':'شب کساد',0,d.luck>1?'pos':'neg']);
  $('rcRows').innerHTML=rows.map(function(row,i){
    const k=row[0],v=row[1],c=row[2];
    return '<div class="r-row '+c+'" style="animation-delay:'+(i*90+120)+'ms"><span>'+k+
      '</span><span class="num">'+(v?((v<0?'−':'+')+money(Math.abs(v))):'—')+'</span></div>';
  }).join('');
  $('rcNote').textContent=d.note;
  rcNet=d.net; rcUsedAd=false;
  $('rcNet').textContent=money(rcNet);
  $('rcAd').disabled=false;
  $('rcAd').textContent='تماشای تبلیغ: خالص شب دو برابر';
  $('rcVeil').hidden=false; SFX.print();
}
$('rcAd').addEventListener('click',()=>{
  if(rcUsedAd||$('rcVeil').hidden) return;
  rcUsedAd=true; S.money+=rcNet; S.total+=rcNet; rcNet*=2;
  $('rcNet').textContent=money(rcNet);
  $('rcAd').disabled=true; $('rcAd').textContent='دو برابر شد';
  SFX.coin(); buzz(15); syncUI(); save();
});
$('rcCopy').addEventListener('click',async()=>{
  const t='آبرو | شب '+fa(S.day)+' — '+tier().name+'\n'+S.lastNote+
    '\nخالص شب: '+money(rcNet)+' تومان\nاصالت: '+fa(Math.round(S.integ))+' از ۱۰۰';
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      await navigator.clipboard.writeText(t); toast('کپی شد. بفرست.');
    }else toast('مرورگر اجازه‌ی کپی نمی‌دهد.');
  }catch(e){toast('کپی نشد.');}
});
$('rcOk').addEventListener('click',()=>{$('rcVeil').hidden=true;});

/* ═══════════ حلقه ═══════════ */
let last=performance.now(), coinT=0;
function loop(now){
  const dt=clamp((now-last)/1000,0,.25); last=now;
  const T=now/1000;
  heat=Math.max(0,heat-dt*.3);
  if(!anyVeil()){
    const r=rate();
    S.money+=r*dt; S.total+=r*dt;
    S.integ=clamp(S.integ+ING[S.ing].integ*.02*dt,0,100);
    if(goal&&goal.type==='earn'&&!goal.done) goal.have+=r*dt;
    evTimer-=dt;
    if(evTimer<=0){ evTimer=50+Math.random()*40; fireEvent(); }
    if(r>0&&!RM){
      coinT-=dt;
      if(coinT<=0){ coinT=1.5+Math.random()*1.7; spawnCoin(r*(1.4+Math.random())); if(Math.random()<.4) SFX.coin(); }
    }
    walkT-=dt;
    if(walkT<=0){ walkT=Math.max(1.8,7-Math.log10(1+r)*1.6)+Math.random()*2.6; spawnWalker(); }
    if(S.lvl.peyk>0){
      bikeT-=dt;
      if(bikeT<=0){ bikeT=Math.max(4,13-S.lvl.peyk*.35)+Math.random()*5; spawnBike(); }
    }
    goalTick(dt);
  }
  disp+=(S.money-disp)*Math.min(1,dt*6);
  if(Math.abs(S.money-disp)<1) disp=S.money;
  camera(dt);
  tickSteam(dt,T); tickParticles(dt); tickWalkers(dt); tickRain(dt);
  render(dt,T);
  requestAnimationFrame(loop);
}
setInterval(()=>{ if(!anyVeil()){ syncUI(); syncGoal(); } },200);
setInterval(save,6000);

let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ hiddenAt=Date.now(); save(); }
  else{
    last=performance.now();
    if(!hiddenAt) return;
    const away=clamp((Date.now()-hiddenAt)/1000,0,12*3600);
    hiddenAt=0;
    if(away<20||!spaceUsed()) return;
    if(away<300){
      const g=rate()*away*.5;
      S.money+=g; S.total+=g;
      toast('در نبودت '+money(g)+' تومان جمع شد.');
      syncUI(); save();
    }else if(!anyVeil()) runShift(away/3600,false);
  }
});
window.addEventListener('pagehide',save);
window.addEventListener('resize',resize);
if(window.ResizeObserver) new ResizeObserver(resize).observe($('device'));

/* ═══════════ شروع ═══════════ */
(function start(){
  FONT=getComputedStyle(document.body).fontFamily||'sans-serif';
  buildSprites();
  buildBackdrop();
  buildOpts();
  resize();

  const saved=load();
  const fresh=!(saved&&saved.lvl);
  if(!fresh) S=adopt(saved);
  disp=S.money;
  frameFor(S.tier);
  visW=tgtW; visH=tgtH; visY=tgtVY;
  syncUI(); syncGoal();

  const away=fresh?0:clamp((Date.now()-(S.ts||Date.now()))/1000,0,12*3600);
  setTimeout(()=>{ $('boot').classList.add('gone'); booted=true; },RM?200:1500);
  setTimeout(()=>{
    if(fresh){ toast('چرخ پدر افتاده گوشه‌ی حیاط. هلش بده سر خیابان.'); openTab('shop'); }
    else if(away>90&&spaceUsed()) runShift(away/3600,false);
    else toast('برگشتی. مغازه باز است.');
  },RM?300:1900);

  requestAnimationFrame(loop);

  window.__game={EVENTS,STATIONS,TIERS,state:()=>S,rate,runShift,
    grant:v=>{S.money+=v;S.total+=v;disp=S.money;syncUI();},
    forceEvent:i=>openEvent(i),
    setTier:i=>{S.tier=clamp(i,0,TIERS.length-1);frameFor(S.tier);syncUI();},
    frame:t=>render(.016,t||1),
    openTab, closeSheet, serve, newGoal:()=>{newGoal();syncGoal();},
    booted:()=>booted};
})();
})();
</script>
